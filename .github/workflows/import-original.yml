name: Restore original project history
on:
  push:
    branches: [project-import]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/project-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original bundle and restore main
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/history.bundle"
          cat import/part-* > "$bundle"
          echo "8d01dd4136ab74b72283dea70560be5381ffe7a07797c0bb2292482abc1d571e  $bundle" | sha256sum -c -
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/dev/v2:refs/remotes/import/dev-v2 refs/tags/baseline-v1:refs/tags/baseline-v1
          git switch -c complete origin/main
          git read-tree --reset -u refs/remotes/import/dev-v2
          git restore --source=origin/main --staged --worktree -- AGENTS.md CHANGELOG.md README.md
          cp "$bundle" history.bundle
          git add history.bundle
          test "$(git write-tree)" = fc589e656a7a177481bdc8ec04f0082456556aa2
          git config user.name "Project import"
          git config user.email "project-import@users.noreply.github.com"
          restored=$(git commit-tree "$(git write-tree)" -p origin/main -p refs/remotes/import/dev-v2 -m "Restore complete project and original development history")
          git push --atomic origin "$restored:refs/heads/main" refs/tags/baseline-v1
